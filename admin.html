<!doctype html>
<html lang="tr" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAYL Admin</title><style>
:root{--bg:#080808;--panel:#141414;--panel2:#1b1b1b;--gold:#d4af37;--gold2:#f0d36d;--text:#f8f3e6;--muted:#bdb5a6;--line:#3b321d;--green:#25d366;--red:#ff5b5b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at top,rgba(212,175,55,.15),transparent 25%),linear-gradient(#101010,#050505);color:var(--text)}
a{text-decoration:none}.container{width:min(1120px,calc(100% - 28px));margin:auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,.2)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:13px 0;gap:12px}.brand{display:flex;align-items:center;gap:10px;color:var(--gold2);font-weight:900}.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}.pill.active,.btn.gold{background:var(--gold);color:#111}
.hero{padding:48px 0 30px;text-align:center}.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 40px rgba(212,175,55,.28)}h1,h2,h3{color:var(--gold2)}h1{font-size:clamp(38px,7vw,68px);margin:20px 0 12px}.hero p{color:#ded6c7;line-height:1.8;max-width:760px;margin:0 auto}.cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.wa{background:var(--green);color:#07140b;border:0}.ig{border:1px solid var(--gold);color:var(--gold2)}
section{padding:28px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.section-head h2{margin:0}.section-head p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;overflow:hidden}.product-img{width:100%;height:235px;object-fit:cover;background:#222;display:block}.product-body{padding:17px}.product-body h3{margin:0 0 8px}.product-body p{color:var(--muted);line-height:1.6;min-height:48px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:20px;font-weight:900;color:var(--gold2)}.small-wa{background:var(--green);color:#07140b;padding:10px 12px;border-radius:999px;font-size:13px;font-weight:900}
.empty{text-align:center;padding:40px;border:1px dashed #6a592b;border-radius:18px;color:var(--muted);grid-column:1/-1}footer{border-top:1px solid rgba(212,175,55,.18);margin-top:30px}.footer{padding:26px 0;color:#91897c;text-align:center}
.panel{max-width:760px;margin:36px auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-weight:800;color:var(--gold2)}input,textarea,select{width:100%;background:#0c0c0c;color:#fff;border:1px solid #4b4128;border-radius:12px;padding:13px;font-size:16px}textarea{min-height:95px;resize:vertical}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn.full{width:100%;border-radius:12px}.btn.red{border-color:var(--red);color:#fff;background:#9b2020}.notice{padding:12px;border-radius:12px;margin:12px 0;background:#202020;color:#ddd}.hidden{display:none!important}.admin-list{display:grid;gap:12px;margin-top:20px}.admin-item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:#111;border:1px solid #3b321d;border-radius:14px;padding:10px}.admin-item img{width:72px;height:72px;object-fit:cover;border-radius:10px}.admin-item h4{margin:0 0 5px;color:var(--gold2)}.admin-item p{margin:0;color:var(--muted);font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.brand span{display:none}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.admin-grid{grid-template-columns:1fr}.admin-item{grid-template-columns:60px 1fr}.admin-item img{width:60px;height:60px}.admin-item .btn{grid-column:1/-1}}

.check-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.check-row label{display:flex;gap:8px;align-items:center;background:#151515;border:1px solid #333;border-radius:12px;padding:10px 12px}
.check-row input{width:auto}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:10px}
.preview-grid img{width:100%;height:90px;object-fit:cover;border-radius:12px;border:1px solid #333}
</style></head>
<body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.jpeg"><span>LAYL ADMIN</span></a><div class="actions"><button id="adminTrBtn" class="pill active">Türkçe</button><button id="adminArBtn" class="pill">العربية</button><button id="adminEnBtn" class="pill">English</button><a id="backSite" class="pill" href="index.html">Siteye Dön</a></div></div></header>
<main class="container">
<section id="loginBox" class="panel"><h2 data-i18n="loginTitle">Yönetici Girişi</h2><p style="color:var(--muted)"><span data-i18n="loginSub">Firebase Authentication hesabınla giriş yap.</span></p>
<div class="field"><label data-i18n="email">E-posta</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label data-i18n="password">Şifre</label><input id="password" type="password" autocomplete="current-password"></div>
<button id="loginBtn" class="btn gold full" data-i18n="loginBtn">Giriş Yap</button><div id="loginMsg" class="notice hidden"></div></section>

<section id="adminBox" class="panel hidden"><div class="row"><h2 data-i18n="manage">Ürün Yönetimi</h2><button id="logoutBtn" class="btn" data-i18n="logout">Çıkış</button></div>
<form id="productForm">
<input type="hidden" id="editId">
<div class="admin-grid">
<div class="field"><label data-i18n="nameTr">Türkçe ürün adı</label><input id="nameTr" required></div>
<div class="field"><label data-i18n="nameAr">Arapça ürün adı</label><input id="nameAr" required dir="rtl"></div>
<div class="field"><label data-i18n="nameEn">İngilizce ürün adı</label><input id="nameEn"></div>
<div class="field"><label data-i18n="price">Fiyat</label><select id="currency"><option value="USD">USD ($)</option><option value="EUR">Euro (€)</option><option value="TRY">TL (₺)</option><option value="SYP">SYP (£S)</option></select><input id="price" placeholder="Yeni fiyat" required></div><div class="field"><label data-i18n="oldPrice">Eski fiyat (isteğe bağlı)</label><input id="oldPrice" placeholder="İndirim yoksa boş bırak"></div>
<div class="field"><label data-i18n="category">Kategori</label><select id="category"><option value="perfume" data-cat="perfume">Parfüm</option><option value="shampoo" data-cat="shampoo">Şampuan</option><option value="mask" data-cat="mask">Maske</option><option value="cream" data-cat="cream">Krem</option><option value="other" data-cat="other">Diğer</option></select></div>
<div class="field"><label data-i18n="stock">Stok durumu</label><select id="stock"><option value="1" data-stock="in">Stokta</option><option value="0" data-stock="out">Tükendi</option></select></div><div class="field"><label data-i18n="stockQty">Stok adedi</label><input id="stockQty" type="number" min="0" value="1"></div>
<div class="field perfume-meta"><label>Parfüm: Kimin için?</label><select id="pfGender"><option value="">Seç</option><option value="women">Kadın</option><option value="men">Erkek</option><option value="unisex">Unisex</option></select></div>
<div class="field perfume-meta"><label>Parfüm: Koku tarzı</label><select id="pfStyle"><option value="">Seç</option><option value="sweet">Tatlı</option><option value="fresh">Ferah</option><option value="woody">Odunsu</option><option value="spicy">Baharatlı</option><option value="floral">Çiçeksi</option></select></div>
<div class="field perfume-meta"><label>Parfüm: Mevsim</label><select id="pfSeason"><option value="">Seç</option><option value="summer">Yaz</option><option value="winter">Kış</option><option value="spring">İlkbahar</option><option value="autumn">Sonbahar</option><option value="all">Dört mevsim</option></select></div>
<div class="field perfume-meta"><label>Parfüm: Kullanım</label><select id="pfOccasion"><option value="">Seç</option><option value="day">Gündüz</option><option value="night">Gece</option><option value="daily">Günlük</option><option value="special">Özel gün</option></select></div>
<div class="field perfume-meta"><label>Parfüm: Yoğunluk</label><select id="pfStrength"><option value="">Seç</option><option value="light">Hafif</option><option value="medium">Orta</option><option value="strong">Güçlü</option></select></div>
</div>
<div class="admin-grid">
<div class="field"><label data-i18n="badges">Ürün rozetleri</label><div class="check-row">
<label><input id="isNew" type="checkbox"><span data-i18n="newBadge">Yeni Ürün</span></label>
<label><input id="isBest" type="checkbox"><span data-i18n="bestBadge">En Çok Satan</span></label>
</div></div><div class="field"><label data-i18n="descTr">Türkçe açıklama</label><textarea id="descTr"></textarea></div>
<div class="field"><label data-i18n="descAr">Arapça açıklama</label><textarea id="descAr" dir="rtl"></textarea></div>
<div class="field"><label data-i18n="descEn">İngilizce açıklama</label><textarea id="descEn"></textarea></div>
</div>
<div class="field"><label data-i18n="photos">Ürün fotoğrafları (en fazla 4)</label><input id="imageFiles" type="file" accept="image/*" multiple><small style="color:var(--muted)"><span data-i18n="photosHelp">Birden fazla fotoğraf seçebilirsin. Fotoğraflar küçültülerek kaydedilir.</span></small><div id="imagePreview" class="preview-grid"></div></div>
<div class="field"><label data-i18n="video">Ürün video bağlantısı (isteğe bağlı)</label><input id="videoUrl" type="url" placeholder="https://..."></div>
<div class="row"><button class="btn gold" type="submit" id="saveBtn" data-i18n="save">Ürünü Kaydet</button><button class="btn hidden" type="button" id="cancelEdit" data-i18n="cancel">Düzenlemeyi İptal Et</button></div>
<div id="formMsg" class="notice hidden"></div>
</form>
<div id="adminList" class="admin-list"></div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3KR8qNbuNtPXGfz4hKm7fRfaRftuIZvE",
  authDomain: "layl-kozmetik.firebaseapp.com",
  projectId: "layl-kozmetik",
  storageBucket: "layl-kozmetik.firebasestorage.app",
  messagingSenderId: "865670235900",
  appId: "1:865670235900:web:de1030480e1f0199dcf979",
  measurementId: "G-W5GBE7WRFF"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let productsCache=[];let adminLang=localStorage.getItem("laylAdminLang")||"tr";
const adminT={
 tr:{dir:"ltr",backSite:"Siteye Dön",loginTitle:"Yönetici Girişi",loginSub:"Firebase Authentication hesabınla giriş yap.",email:"E-posta",password:"Şifre",loginBtn:"Giriş Yap",manage:"Ürün Yönetimi",logout:"Çıkış",nameTr:"Türkçe ürün adı",nameAr:"Arapça ürün adı",nameEn:"İngilizce ürün adı",price:"Fiyat",oldPrice:"Eski fiyat (isteğe bağlı)",stockQty:"Stok adedi",badges:"Ürün rozetleri",newBadge:"Yeni Ürün",bestBadge:"En Çok Satan",photos:"Ürün fotoğrafları (en fazla 4)",photosHelp:"Birden fazla fotoğraf seçebilirsin. Fotoğraflar küçültülerek kaydedilir.",video:"Ürün video bağlantısı (isteğe bağlı)",category:"Kategori",stock:"Stok durumu",inStock:"Stokta",outStock:"Tükendi",descTr:"Türkçe açıklama",descAr:"Arapça açıklama",descEn:"İngilizce açıklama",photo:"Ürün fotoğrafı",photoHelp:"Fotoğraf telefonda küçültülüp Firebase'e kaydedilir. Çok büyük görsel seçme.",save:"Ürünü Kaydet",cancel:"Düzenlemeyi İptal Et",edit:"Düzenle",del:"Sil",empty:"Henüz ürün yok.",updated:"Ürün güncellendi.",added:"Ürün eklendi.",saveEdit:"Değişiklikleri Kaydet",confirm:"Bu ürünü silmek istediğine emin misin?",cats:{perfume:"Parfüm",shampoo:"Şampuan",mask:"Maske",cream:"Krem",other:"Diğer"}},
 ar:{dir:"rtl",backSite:"العودة للموقع",loginTitle:"تسجيل دخول الإدارة",loginSub:"سجّل الدخول باستخدام حساب Firebase Authentication.",email:"البريد الإلكتروني",password:"كلمة المرور",loginBtn:"تسجيل الدخول",manage:"إدارة المنتجات",logout:"تسجيل الخروج",nameTr:"اسم المنتج بالتركية",nameAr:"اسم المنتج بالعربية",nameEn:"اسم المنتج بالإنجليزية",price:"السعر",oldPrice:"السعر القديم (اختياري)",stockQty:"كمية المخزون",badges:"شارات المنتج",newBadge:"منتج جديد",bestBadge:"الأكثر مبيعًا",photos:"صور المنتج (حتى 4)",photosHelp:"يمكنك اختيار عدة صور. سيتم ضغط الصور قبل الحفظ.",video:"رابط فيديو المنتج (اختياري)",category:"القسم",stock:"حالة المخزون",inStock:"متوفر",outStock:"نفد المخزون",descTr:"الوصف بالتركية",descAr:"الوصف بالعربية",descEn:"الوصف بالإنجليزية",photo:"صورة المنتج",photoHelp:"يتم تصغير الصورة على الهاتف وحفظها في Firebase. لا تختَر صورة كبيرة جدًا.",save:"حفظ المنتج",cancel:"إلغاء التعديل",edit:"تعديل",del:"حذف",empty:"لا توجد منتجات بعد.",updated:"تم تحديث المنتج.",added:"تمت إضافة المنتج.",saveEdit:"حفظ التعديلات",confirm:"هل أنت متأكد أنك تريد حذف هذا المنتج؟",cats:{perfume:"العطور",shampoo:"الشامبو",mask:"الماسكات",cream:"الكريمات",other:"أخرى"}},
 en:{dir:"ltr",backSite:"Back to Site",loginTitle:"Admin Login",loginSub:"Sign in with your Firebase Authentication account.",email:"Email",password:"Password",loginBtn:"Sign In",manage:"Product Management",logout:"Log Out",nameTr:"Turkish product name",nameAr:"Arabic product name",nameEn:"English product name",price:"Price",oldPrice:"Old price (optional)",stockQty:"Stock quantity",badges:"Product badges",newBadge:"New Product",bestBadge:"Best Seller",photos:"Product photos (up to 4)",photosHelp:"You can select multiple photos. Images are compressed before saving.",video:"Product video URL (optional)",category:"Category",stock:"Stock status",inStock:"In Stock",outStock:"Out of Stock",descTr:"Turkish description",descAr:"Arabic description",descEn:"English description",photo:"Product photo",photoHelp:"The image is compressed on the phone and saved to Firebase. Avoid very large images.",save:"Save Product",cancel:"Cancel Editing",edit:"Edit",del:"Delete",empty:"No products yet.",updated:"Product updated.",added:"Product added.",saveEdit:"Save Changes",confirm:"Are you sure you want to delete this product?",cats:{perfume:"Perfume",shampoo:"Shampoo",mask:"Mask",cream:"Cream",other:"Other"}}
};
function setAdminLang(l){adminLang=l;document.documentElement.lang=l;document.documentElement.dir=adminT[l].dir;document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(adminT[l][k])el.textContent=adminT[l][k]});document.querySelectorAll("[data-cat]").forEach(el=>el.textContent=adminT[l].cats[el.dataset.cat]);document.querySelectorAll("[data-stock]").forEach(el=>el.textContent=el.dataset.stock==="in"?adminT[l].inStock:adminT[l].outStock);backSite.textContent=adminT[l].backSite;adminTrBtn.classList.toggle("active",l==="tr");adminArBtn.classList.toggle("active",l==="ar");adminEnBtn.classList.toggle("active",l==="en");localStorage.setItem("laylAdminLang",l);if(productsCache.length)renderAdminList();}
adminTrBtn.onclick=()=>setAdminLang("tr");adminArBtn.onclick=()=>setAdminLang("ar");adminEnBtn.onclick=()=>setAdminLang("en");
const show=(el,msg)=>{el.textContent=msg;el.classList.remove("hidden")};setAdminLang(adminLang);
loginBtn.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);}catch(e){show(loginMsg,e.message)}};
logoutBtn.onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{loginBox.classList.toggle("hidden",!!u);adminBox.classList.toggle("hidden",!u);if(u)startList();});
function compressImage(file){return new Promise((resolve,reject)=>{if(!file) return resolve("");const img=new Image(),reader=new FileReader();reader.onload=e=>img.src=e.target.result;reader.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,max=1100;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);const data=c.toDataURL("image/jpeg",.72);if(data.length>850000) reject(new Error("Fotoğraf hâlâ çok büyük. Daha küçük bir fotoğraf seç."));else resolve(data)};reader.readAsDataURL(file)})}
productForm.onsubmit=async e=>{e.preventDefault();saveBtn.disabled=true;try{
 const id=editId.value;
 let existing=id?productsCache.find(x=>x.id===id):null;
 let images=existing?.images?.length?[...existing.images]:(existing?.image?[existing.image]:[]);
 const selected=[...imageFiles.files].slice(0,4);
 if(selected.length){images=[];for(const file of selected){images.push(await compressImage(file));}}
 const qty=Math.max(0,Number(stockQty.value||0));
 const data={
  nameTr:nameTr.value.trim(),nameAr:nameAr.value.trim(),nameEn:nameEn.value.trim(),
  price:price.value.trim(),oldPrice:oldPrice.value.trim(),currency:currency.value,
  category:category.value,pfGender:pfGender.value,pfStyle:pfStyle.value,pfSeason:pfSeason.value,pfOccasion:pfOccasion.value,pfStrength:pfStrength.value,descTr:descTr.value.trim(),descAr:descAr.value.trim(),descEn:descEn.value.trim(),
  images,image:images[0]||"",videoUrl:videoUrl.value.trim(),
  stock:Number(stock.value),stockQty:qty,inStock:stock.value==="1"&&qty>0,
  isNew:isNew.checked,isBest:isBest.checked
 };
 if(id){await updateDoc(doc(db,"products",id),data);show(formMsg,adminT[adminLang].updated)}
 else{data.createdAt=serverTimestamp();await addDoc(collection(db,"products"),data);show(formMsg,adminT[adminLang].added)}
 resetForm();
}catch(err){show(formMsg,err.message)}finally{saveBtn.disabled=false}};
function resetForm(){productForm.reset();editId.value="";imagePreview.innerHTML="";stockQty.value="1";saveBtn.textContent=adminT[adminLang].save;cancelEdit.classList.add("hidden")}cancelEdit.onclick=resetForm;
function renderAdminList(){adminList.innerHTML=productsCache.length?productsCache.map(p=>`<div class="admin-item"><img src="${p.image||"logo.jpeg"}"><div><h4>${adminLang==="ar"?(p.nameAr||p.nameTr||p.nameEn):adminLang==="en"?(p.nameEn||p.nameTr||p.nameAr):(p.nameTr||p.nameAr||p.nameEn)}</h4><p>${p.price} ${p.currency||""} • ${adminT[adminLang].cats[p.category]||p.category} • ${(p.stock===0||p.inStock===false)?adminT[adminLang].outStock:adminT[adminLang].inStock} (${p.stockQty??0}) ${p.isNew?"• NEW":""} ${p.isBest?"• BEST":""}</p></div><div><button class="btn" data-edit="${p.id}">${adminT[adminLang].edit}</button> <button class="btn red" data-del="${p.id}">${adminT[adminLang].del}</button></div></div>`).join(""):`<div class="notice">${adminT[adminLang].empty}</div>`;adminList.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));adminList.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>removeProduct(b.dataset.del));}
function startList(){const q=query(collection(db,"products"),orderBy("createdAt","desc"));onSnapshot(q,s=>{productsCache=s.docs.map(d=>({id:d.id,...d.data()}));renderAdminList();},e=>show(formMsg,e.message));}
function editProduct(id){const p=productsCache.find(x=>x.id===id);if(!p)return;
 editId.value=id;nameTr.value=p.nameTr||"";nameAr.value=p.nameAr||"";nameEn.value=p.nameEn||"";
 price.value=p.price||"";oldPrice.value=p.oldPrice||"";currency.value=p.currency||"USD";category.value=p.category||"other";
 stock.value=(p.stock===0||p.inStock===false)?"0":"1";stockQty.value=p.stockQty??1;
 isNew.checked=!!p.isNew;isBest.checked=!!p.isBest; pfGender.value=p.pfGender||"";pfStyle.value=p.pfStyle||"";pfSeason.value=p.pfSeason||"";pfOccasion.value=p.pfOccasion||"";pfStrength.value=p.pfStrength||"";
 descTr.value=p.descTr||"";descAr.value=p.descAr||"";descEn.value=p.descEn||"";videoUrl.value=p.videoUrl||"";
 const imgs=p.images?.length?p.images:(p.image?[p.image]:[]);
 imagePreview.innerHTML=imgs.map(src=>`<img src="${src}" alt="">`).join("");
 saveBtn.textContent=adminT[adminLang].saveEdit;cancelEdit.classList.remove("hidden");formMsg.classList.add("hidden");window.scrollTo({top:adminBox.offsetTop-70,behavior:"smooth"})
}
imageFiles.onchange=()=>{imagePreview.innerHTML=[...imageFiles.files].slice(0,4).map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join("")};
async function removeProduct(id){if(confirm(adminT[adminLang].confirm))await deleteDoc(doc(db,"products",id));}
</script>
</body></html>
